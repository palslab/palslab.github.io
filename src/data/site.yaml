# Hero welcome — based on published work only
welcome: >-
  We use computation to understand how cells are organized, how their gene expression
  evolves, and how they fail: from expression evolution across species and single-cell
  atlases to the development and aging of photoreceptors. Our tools range from
  stochastic process models and physics-informed neural networks to scalable algorithms.

pi:
  name: Soumitra Pal
  title: Staff Scientist
  affiliation: National Eye Institute, National Institutes of Health
  photo: /images/pi.jpg   # 800 px; /images/pi-480.jpg used for normal screens
  bio: >-
    Soumitra Pal is a computational biologist trained in computer science (B.E., IIEST
    Shibpur; M.Tech. and Ph.D., IIT Bombay). After designing DSP simulators at Texas
    Instruments, he moved into bioinformatics: parallel and randomized algorithms for
    sequence analysis at IIT Bombay and the University of Connecticut, then five years
    with Teresa Przytycka at NCBI on DNA shape in transcription-factor binding,
    gene-expression evolution and the Fly Cell Atlas. He now works with Anand Swaroop
    on retinal development, aging and evolution, using bulk and single-cell expression
    data from more than 100 species.

lab_name: Pal Lab
subtitle: Computational Biology
tagline: GROUNDING VIRTUAL CELLS
site_url: https://palslab.github.io

# Hero welcome (vision level only — no aims, no results)
welcome: >-
  We build predictive, experimentally grounded models of cell state: models that
  represent a cell's molecular state, detect its departure from health, and predict
  the interventions that restore it. Photoreceptors are our first system.


philosophy: >-
  We judge mentoring by the independence, skills and scientific products that trainees
  develop. Trainees so far have ranged from high-school students to graduate interns,
  and several are co-authors on the resulting manuscripts. In the lab, each trainee
  will start from tested, shared code and data, so their work builds toward open
  software and benchmarks.
